    <div id="lightbox" class="fixed inset-0 bg-black/95 backdrop-blur-lg hidden z-[9999] transition-opacity duration-300 opacity-0 flex flex-col items-center justify-center select-none">

    <script>
      AOS.init({ once: true, duration: 800, offset: 50 });

      // ===== MOBILE MENU LOGIC =====
      const menuBtn = document.getElementById('mobile-menu-btn');
      const dropdown = document.getElementById('mobile-dropdown');
      if (menuBtn && dropdown) {
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if(dropdown.classList.contains('hidden')){
            dropdown.classList.remove('hidden');
            setTimeout(() => { dropdown.classList.replace('opacity-0', 'opacity-100'); dropdown.classList.replace('scale-95', 'scale-100'); }, 10);
          } else { hideMenu(); }
        });
        document.addEventListener('click', hideMenu);
        function hideMenu() { dropdown.classList.replace('opacity-100', 'opacity-0'); dropdown.classList.replace('scale-100', 'scale-95'); setTimeout(() => dropdown.classList.add('hidden'), 300); }
      }

      // ===== Logika Tab Portofolio Pro =====
      const tabs = document.querySelectorAll('.tab-btn');
      const grids = { poster: document.getElementById('grid-poster'), video: document.getElementById('grid-video'), web: document.getElementById('grid-web') };
      
      const setTabActiveStyles = (btn) => { btn.classList.add('bg-white', 'text-black', 'shadow-lg'); btn.classList.remove('text-gray-400', 'hover:text-white'); };
      const setTabInactiveStyles = (btn) => { btn.classList.remove('bg-white', 'text-black', 'shadow-lg'); btn.classList.add('text-gray-400', 'hover:text-white'); };

      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.forEach(b => { b.classList.remove('tab-active'); setTabInactiveStyles(b); });
          btn.classList.add('tab-active');
          setTabActiveStyles(btn);
          const targetTab = btn.getAttribute('data-tab');
          Object.values(grids).forEach(grid => { if(grid) { grid.classList.add('hidden'); grid.style.opacity = '0'; } });
          if (grids[targetTab]) { grids[targetTab].classList.remove('hidden'); setTimeout(() => { grids[targetTab].style.opacity = '1'; }, 50); }
        });
      });

      // ===== Logika Master Lightbox =====
      const lightbox = document.getElementById('lightbox');
      const lbClose = document.getElementById('lb-close');
      const lbContent = document.getElementById('lightbox-content');
      
      document.body.addEventListener('click', (e) => {
          const card = e.target.closest('.media-card');
          if (!card) return; 
          e.preventDefault();
          const type = card.dataset.type;
          lbContent.innerHTML = '';
          
          if (type === 'image') {
            const img = document.createElement('img');
            img.src = card.dataset.full;
            img.className = 'w-auto h-auto max-w-full max-h-[90vh] lg:max-h-[95vh] object-contain rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.5)]';
            lbContent.appendChild(img);
          } else if (type === 'video') {
            const videoSrc = card.dataset.video;
            const video = document.createElement('video');
            video.src = videoSrc; video.controls = true; video.autoplay = true;
            if (videoSrc.includes('barasuara')) video.muted = true;
            video.className = 'w-auto h-auto max-w-full max-h-[90vh] lg:max-h-[95vh] rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.5)]';
            lbContent.appendChild(video);
          } else if (type === 'slider') {
            const images = card.dataset.images.split(',');
            let currentIndex = 0;
            const container = document.createElement('div');
            container.className = 'relative w-full h-full flex flex-col items-center justify-center';
            const img = document.createElement('img');
            img.src = images[currentIndex];
            img.className = 'w-auto h-auto max-w-full max-h-[90vh] lg:max-h-[95vh] object-contain rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.5)] transition-opacity duration-300 pointer-events-none select-none';
            const clickLayer = document.createElement('div');
            clickLayer.className = 'absolute inset-0 z-10 flex';
            const leftClickArea = document.createElement('div'); leftClickArea.className = 'w-1/2 h-full cursor-pointer';
            const rightClickArea = document.createElement('div'); rightClickArea.className = 'w-1/2 h-full cursor-pointer';
            
            const prevBtn = document.createElement('button');
            prevBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>'; 
            prevBtn.className = 'absolute left-4 lg:left-10 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/90 text-white backdrop-blur-md rounded-full w-14 h-14 flex items-center justify-center z-20 cursor-pointer border border-white/20';
            const nextBtn = document.createElement('button');
            nextBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
            nextBtn.className = 'absolute right-4 lg:right-10 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/90 text-white backdrop-blur-md rounded-full w-14 h-14 flex items-center justify-center z-20 cursor-pointer border border-white/20';

            const counter = document.createElement('div');
            counter.className = 'absolute bottom-6 left-1/2 -translate-x-1/2 bg-black/80 text-white font-bold backdrop-blur-md px-6 py-2.5 rounded-full text-sm tracking-widest border border-white/20 z-20 shadow-xl';
            counter.innerText = `1 / ${images.length}`;

            const updateView = () => {
                img.style.opacity = '0.3';
                setTimeout(() => { img.src = images[currentIndex]; img.style.opacity = '1'; counter.innerText = `${currentIndex + 1} / ${images.length}`; }, 150);
            };
            const slidePrev = () => { currentIndex = currentIndex === 0 ? images.length - 1 : currentIndex - 1; updateView(); };
            const slideNext = () => { currentIndex = currentIndex === images.length - 1 ? 0 : currentIndex + 1; updateView(); };

            let touchstartX = 0; let touchendX = 0;
            container.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
            container.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; if (touchendX < touchstartX - 40) slideNext(); if (touchendX > touchstartX + 40) slidePrev(); }, {passive: true});

            leftClickArea.addEventListener('click', (e) => { e.stopPropagation(); slidePrev(); });
            rightClickArea.addEventListener('click', (e) => { e.stopPropagation(); slideNext(); });
            prevBtn.addEventListener('click', (e) => { e.stopPropagation(); slidePrev(); });
            nextBtn.addEventListener('click', (e) => { e.stopPropagation(); slideNext(); });

            clickLayer.appendChild(leftClickArea); clickLayer.appendChild(rightClickArea);
            container.appendChild(img); container.appendChild(clickLayer);
            if(images.length > 1) { container.appendChild(prevBtn); container.appendChild(nextBtn); container.appendChild(counter); }
            lbContent.appendChild(container);
          }
          
          lightbox.classList.remove('hidden'); document.body.style.overflow = 'hidden';
          setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
      });

      const closeLightboxHandler = () => {
        lightbox.classList.add('opacity-0');
        const videoElement = lbContent.querySelector('video');
        if (videoElement) videoElement.pause();
        document.body.style.overflow = '';
        setTimeout(() => { lightbox.classList.add('hidden'); lbContent.innerHTML = ''; }, 300); 
      };

      lbClose.addEventListener('click', closeLightboxHandler);
      lightbox.addEventListener('click', (e) => { if(e.target === lightbox || e.target === lbContent) closeLightboxHandler(); });
    </script>
  </body>
</html>
